[package]
name = "dsh-desktop"
version = "0.2.2"
description = "DeepSeek Harness (dsh web) 的 Tauri 桌面封装"
authors = ["DeepSeek Harness"]
edition = "2021"
rust-version = "1.77"

# 产物名:决定 .app/.dmg 的产品名
[[bin]]
name = "dsh-desktop"
path = "src/main.rs"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
# 体积优先:strip 符号、压缩、LTO
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
