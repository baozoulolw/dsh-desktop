name: Build & Package

# 触发方式:
#  - 手动:仓库 Actions 页点 "Run workflow"
#  - 打了 v* 标签(如 v0.1.0)自动触发
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 每个平台独立打包
        include:
          - os: macos-latest      # arm64 Apple Silicon
            name: mac-arm64
            args: --target aarch64-apple-darwin
          - os: ubuntu-latest     # x64
            name: linux-x64
          - os: windows-latest    # x64
            name: win-x64
    runs-on: ${{ matrix.os }}
    # 发布 GitHub Releases 需要写入权限
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # tauri-action 执行 tauri build 并上传产物到 GitHub Releases(tag 场景会建草稿)
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DeepSeek Harness ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # tauri-action 默认把 release 建为草稿,打 tag 时把所有平台产物上传完后转正式。
      - name: Publish release (转正式)
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn